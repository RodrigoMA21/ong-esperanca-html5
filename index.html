<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ONG Esperança - Organização dedicada a ações sociais, voluntariado e solidariedade."
    >

    <title>ONG Esperança</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="site-header">

        <div class="header-container">

            <h1 class="site-title">
                ONG Esperança
            </h1>

            <input
                type="checkbox"
                id="menu-toggle"
                class="menu-toggle"
            >

            <label
                for="menu-toggle"
                class="menu-button"
                aria-label="Abrir menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav
                class="main-navigation"
                aria-label="Navegação principal"
            >

                <ul class="nav-list">

                    <li class="nav-item">

                        <a
                            href="#/"
                            data-route="/"
                            aria-current="page"
                        >
                            Início
                        </a>

                    </li>

                    <li class="nav-item dropdown">

                        <a
                            href="#/projetos"
                            data-route="/projetos"
                        >
                            Projetos
                        </a>

                        <ul class="dropdown-menu">

                            <li>

                                <a
                                    href="#/projetos"
                                    data-route="/projetos"
                                >
                                    Projetos sociais
                                </a>

                            </li>

                            <li>

                                <a
                                    href="#/cadastro"
                                    data-route="/cadastro"
                                >
                                    Seja voluntário
                                </a>

                            </li>

                        </ul>

                    </li>

                    <li class="nav-item">

                        <a
                            href="#/cadastro"
                            data-route="/cadastro"
                        >
                            Cadastre-se
                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main
        id="app"
        class="container"
        aria-live="polite"
    >
        <!--
            O conteúdo das páginas será
            renderizado dinamicamente pelo JavaScript.
        -->
    </main>


    <footer>

        <p>
            &copy; 2026 ONG Esperança.
            Todos os direitos reservados.
        </p>

    </footer>


    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
